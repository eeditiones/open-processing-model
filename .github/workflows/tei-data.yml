# Builds the TEI artifact `opm odd document` downloads at runtime and publishes
# it to the rolling `tei-data` release.
#
# The artifact is the TEI Guidelines with every spec inlined and XInclude
# resolved — the same specs as p5subset.xml plus the chapter prose, so one
# fetch replaces both. It is deliberately NOT committed: git keeps every
# historical blob, and gzipped XML does not delta-compress.
#
# Separate from the package release on purpose. TEI ships on its own schedule,
# so refreshing this data must not require cutting an opm version.
#
# Which TEI release is built is pinned in `tei-version`, not discovered here: a
# new Guidelines release can change content models and prose, so moving to one
# is a reviewed commit followed by a deliberate run of this workflow. Nothing
# runs on a schedule — publishing stays a decision someone takes.
name: TEI data

on:
  workflow_dispatch:
    inputs:
      tei_ref:
        description: >-
          Build this TEI tag instead of the one `tei-version` pins. For
          previewing a release before pinning it; `dev` previews unreleased
          Guidelines. The result is still published, so bump the pin after.
        default: ""

concurrency:
  group: tei-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Resolve the TEI release to build
        id: tei
        env:
          REQUESTED: ${{ inputs.tei_ref }}
        run: |
          set -euo pipefail
          ref="$REQUESTED"
          if [ -z "$ref" ]; then
            pinned=$(grep -vE '^[[:space:]]*(#|$)' tei-version | head -1 | tr -d '[:space:]')
            if ! printf '%s' "$pinned" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
              echo "tei-version must hold a P5 release number like 4.12.0, not '$pinned'" >&2
              exit 1
            fi
            ref="P5_Release_$pinned"
          fi
          version="${ref#P5_Release_}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building TEI $version from $ref"

      - name: Check out the TEI Guidelines source
        uses: actions/checkout@v5
        with:
          repository: TEIC/TEI
          ref: ${{ steps.tei.outputs.ref }}
          path: tei-source
          # The repo is ~420 MB; only the Guidelines source is needed.
          sparse-checkout: P5/Source
          sparse-checkout-cone-mode: true

      - name: Build p5all.xml
        env:
          VERSION: ${{ steps.tei.outputs.version }}
        run: |
          set -euo pipefail
          # The Guidelines source carries its release number, date, revision
          # and self-counts as <?insert …?> placeholders that TEI's Makefile
          # fills. We resolve XInclude ourselves, so we fill them ourselves:
          # the release comes from the tag, the rest from the tagged commit.
          revision=$(git -C tei-source rev-parse --short=9 HEAD)
          released=$(git -C tei-source log -1 --format=%cs)
          # A preview build off a branch has no release number; leave the
          # placeholder standing rather than writing "Version dev" into the
          # edition line as though it were one.
          release="$VERSION"
          printf '%s' "$release" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || release=""
          echo "TEI ${release:-$VERSION}, revision $revision, dated $released"
          # P5/p5.xml is NOT in the repo — TEI gitignores it as a Makefile
          # build product. The XInclude driver is the real input.
          uv run python scripts/build_tei_data.py \
            --source tei-source/P5/Source/guidelines-en.xml \
            --out build/tei-data/p5all.xml \
            --version "$release" \
            --revision "$revision" \
            --date "$released"

      - name: Compress and checksum
        run: |
          set -euo pipefail
          cd build/tei-data
          gzip -9 -c p5all.xml > p5all.xml.gz
          sha256sum p5all.xml.gz p5all.xml > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - name: Verify what we are about to publish
        run: |
          set -euo pipefail
          uv run python scripts/build_tei_data.py --verify build/tei-data/p5all.xml.gz

      - name: Publish to the rolling tei-data release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tei.outputs.version }}
          TEI_REF: ${{ steps.tei.outputs.ref }}
        run: |
          set -euo pipefail
          pinned=$(grep -vE '^[[:space:]]*(#|$)' tei-version | head -1 | tr -d '[:space:]')
          notes="TEI P5 $VERSION, built from TEIC/TEI@$TEI_REF on $(date -u +%Y-%m-%d)."
          if [ "$VERSION" != "$pinned" ]; then
            notes="$notes Preview build — tei-version pins $pinned."
          fi
          if gh release view tei-data >/dev/null 2>&1; then
            gh release edit tei-data --notes "$notes" --title "TEI data ($VERSION)"
          else
            gh release create tei-data \
              --title "TEI data ($VERSION)" --notes "$notes"
          fi
          gh release upload tei-data \
            build/tei-data/p5all.xml.gz build/tei-data/SHA256SUMS --clobber
