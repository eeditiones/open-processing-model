[project]
pythonpath = ["."]

[transform]
odd = "odd/escher.odd"
xpath_extensions = [
    "opm.runtime.common_xpath_functions",
    # tp:region_image / tp:region_coords: where each line sits in the
    # facsimile, from data/regions/<letter>_mapping.xml. Importable because of
    # [project] pythonpath above.
    "extensions.escher_functions",
]

[transform.web]
template = "templates/letter.html.tpl"
# <pb-popover> for names and abbreviations, <pb-facs-link>/<pb-facsimile> for
# the facsimile. The page itself is static: both readings are in it, and
# templates/escher.js switches between them.
webcomponents = true
assets = ["templates/opm-theme-paper.css", "templates/letter.css", "templates/escher.js"]

[transform.web.context]
# The edition's IIIF image server. pb-facsimile appends the image name from
# each page's <pb-facs-link facs>; the hover snippet asks it for one region.
iiif_base = "https://media.sources-online.org/iiif/2/escher!"

[context]
site_name = "Briefedition Alfred Escher"
description = "Briefe von und an Alfred Escher (1819–1882), mit diplomatischer und edierter Lesung und Faksimile."
lang = "de"

# opm-theme-paper.css has a dark palette ("Lamplight"): follow the reader's system.
[context.theme]
color_scheme = "auto"

# The collection index's masthead: the calligraphic opening of Escher's letter
# of 9 July 1831 (K_0097), cut from the edition's IIIF server.
[context.theme.index]
eyebrow = "Briefe"
filter_label = "Briefe filtern"
filter_placeholder = "Briefe filtern: Name, Ort, Datum …"
document_one = "Brief"
document_many = "Briefe"
section_many = "Abschnitte"
list_label = "Als Liste"
grid_label = "Als Kacheln"
empty_label = "Kein Brief passt zum Filter."
open_label = "Öffnen"

[context.theme.index.hero]
image = "https://media.sources-online.org/iiif/2/escher!K_0097_1r_crop.jpg/15,40,1168,360/full/0/default.jpg"
position = "center 40%"

# One page per letter, addressed as the edition addresses it: B0096/, not
# by its file name. The source files and their xml:id say K_0096.
[chunking]
xpath = "//text"
document_name = "'B' || substring-after(/TEI/@xml:id, 'K_')"
file_pattern = "index.html"
output_dir = "chunks"
# index_template = "templates/index.html.tpl"
index_title = "Briefe"
doc_path = "letters"

[[chunking.fragments]]
name = "browse"
scope = "global"
xpath = "//teiHeader"
parameters = { display = "browse" }

[[chunking.fragments]]
name = "breadcrumbs"
xpath = "./ancestor::TEI"
parameters = { mode = "breadcrumb" }

[[chunking.fragments]]
name = "letter_head"
xpath = "./ancestor::TEI"
parameters = { mode = "letter-head" }

# Neighbouring letters, from correspContext: the ODD emits their file stems as
# data-* attributes on a hidden <nav>; templates/letter.html.tpl turns them into
# links.
[[chunking.fragments]]
name = "edition_navigation"
xpath = "./ancestor::TEI"
parameters = { mode = "edition-navigation" }

[[chunking.fragments]]
name = "register"
xpath = "./ancestor::TEI"
parameters = { mode = "register" }
