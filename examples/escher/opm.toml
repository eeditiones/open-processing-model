[project]
pythonpath = ["."]
# Previous/next letter links above the text, from correspContext, and the
# register ("Kontexte") of the people and places a letter names (the ODD's own
# register mode fills it), and the facsimile beside the diplomatic reading.
profiles = ["edition-navigation", "registers", "iiif", "pagefind"]

[transform]
odd = "odd/escher.odd"

# Python modules whose functions the ODD calls as tp:…(); see the
# Extension modules guide for project prefixes and custom behaviours.
[[transform.extensions]]
module = "opm.runtime.common_xpath_functions"

# tp:region_image / tp:region_coords: where each line sits in the
# facsimile, from data/regions/<letter>_mapping.xml. Importable because of
# [project] pythonpath above.
[[transform.extensions]]
module = "extensions.escher_functions"

# The registers, under the name the ODD looks names up by:
# collection($global:register-root)/id(@key). The letters, under the name a
# register entry's page searches for the letters that mention it:
# collection($global:data-default).
[transform.namespaces]
global = "http://teipublisher.com/global"

[transform.variables.global]
register-root = "urn:registers"
data-default = "urn:letters"

[[transform.collections]]
uri = "urn:registers"
documents = ["data/registers/persons.xml", "data/registers/places.xml"]

[[transform.collections]]
uri = "urn:letters"
documents = ["data/letters/*.xml"]

[transform.web]
template = "templates/letter.html.tpl"
# <pb-popover> for names and abbreviations, <pb-facs-link>/<pb-facsimile> for
# the facsimile. The page itself is static: both readings are in it, and
# templates/escher.js switches between them.
webcomponents = true
assets = ["templates/opm-theme-paper.css", "templates/letter.css", "templates/escher.js"]

[context]
site_name = "Briefedition Alfred Escher"
description = "Briefe von und an Alfred Escher (1819–1882), mit diplomatischer und edierter Lesung und Faksimile."
lang = "de"

[[context.menu.items]]
label = "Briefe"
url = "index.html"

[[context.menu.items]]
label = "Orte"
url = "places/index.html"

[[context.menu.items]]
label = "Personen"
url = "people/index.html"

# The registers profile's browse pages, titled in German. Only the title
# is set; everything else comes from the profile.
[[pages]]
path = "places/index.html"
context = { page_title = "Orte" }

[[pages]]
path = "people/index.html"
context = { page_title = "Personen" }

# The edition-navigation profile's links, in German.
[context.features.edition-navigation]
label = "Briefnavigation"
previous_label = "Vorheriger Brief in Edition"
next_label = "Nächster Brief in Edition"
previous_in_correspondence_label = "Vorheriger Brief"
next_in_correspondence_label = "Nächster Brief"
correspondence_label = "Korrespondenz"

# The edition's IIIF image server. pb-facsimile appends the image name from
# each page's <pb-facs-link facs>; the hover snippet (escher.js) asks it for
# one region.
[context.features.iiif]
viewer = "pb-facsimile"
base_uri = "https://media.sources-online.org/iiif/2/escher!"
label = "Faksimile"

[context.features.register]
column = "before"
label = "Kontexte"

# opm-theme-paper.css has a dark palette ("Lamplight"): follow the reader's system.
[context.theme]
color_scheme = "auto"

# The collection index's masthead: the calligraphic opening of Escher's letter
# of 9 July 1831 (K_0097), cut from the edition's IIIF server.
[context.theme.index]
eyebrow = "Briefe"
filter_label = "Briefe filtern"
filter_placeholder = "Briefe filtern: Name, Ort, Datum …"
document_one = "Brief"
document_many = "Briefe"
section_many = "Abschnitte"
list_label = "Als Liste"
grid_label = "Als Kacheln"
empty_label = "Kein Brief passt zum Filter."
open_label = "Öffnen"

[context.theme.index.hero]
image = "https://media.sources-online.org/iiif/2/escher!K_0097_1r_crop.jpg/15,40,1168,360/full/0/default.jpg"
position = "center 40%"

# One page per letter, addressed as the edition addresses it: B0096/, not
# by its file name. The source files and their xml:id say K_0096.
[chunking]
xpath = "//text"
document_name = "'B' || substring-after(/TEI/@xml:id, 'K_')"
file_pattern = "index.html"
output_dir = "chunks"
index_title = "Briefe"
doc_path = "letters"

[[chunking.fragments]]
name = "browse"
scope = "global"
xpath = "//teiHeader"
parameters = { display = "browse" }

[[chunking.fragments]]
name = "breadcrumbs"
xpath = "./ancestor::TEI"
parameters = { mode = "breadcrumb" }

[[chunking.fragments]]
name = "letter_head"
xpath = "./ancestor::TEI"
parameters = { mode = "letter-head" }

[index]
# One record per published page, as site search (Pagefind) expects
granularity = "page"