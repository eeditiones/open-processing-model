[project]
pythonpath = ["."]

[transform]
odd = "odd/serafin.odd"
xpath_extensions = [
    "opm.runtime.common_xpath_functions",
    # Project-local module, importable because of [project] pythonpath above.
    "extensions.serafin_functions"
]

# Registers, reachable from XPath as collection($global:register-root).
# `uri` is used verbatim, so it matches the eXist app's $config:register-root
# and the ODD needs no opm-specific variants.
[[transform.collections]]
uri = "/db/apps/serafin/data/registers"
documents = [
    "data/registers/persons.xml",
    "data/registers/places.xml",
    "data/registers/organizations.xml",
    "data/registers/works.xml",
]

[transform.namespaces]
global = "http://teipublisher.com/global"

[transform.variables.global]
register-root = "/db/apps/serafin/data/registers"

[transform.web]
template = "templates/letter.html.j2"

[transform.web.webcomponents]
enabled = true

[transform.epub]
# [chunking] below selects only the source text: the reading view shows the
# translation beside it, from the `translation` fragment. An EPUB has no second
# panel and no fragments, so selecting the same chunks would drop half the
# letter. Chapters are the two `text` elements instead, which is also what puts
# the ODD's epub heading models on them.
xpath = "//text[@type]"

[transform.typst]
template = "templates/letter.typ.j2"

[transform.typst.context]
source_label = "Transcriptio (lat.)"
translation_label = "Przekład (pol.)"

[chunking]
odd = "odd/serafin.odd"
xpath = ".//text[@type='source']/div"
xpath_dynamic = "//text[@type = 'source']"
output_dir = "chunks"
template = "templates/letter.html.j2"
# Landing page for a directory run, sharing the letter template's shell and CSS.
index_template = "templates/index.html.j2"
index_title = "Listy"
doc_path = "letters"

# The edition's own stylesheet and its texture are copied to chunks/assets/;
# the ODD stylesheet is written to chunks/css/ automatically. letter.css
# references parchment.jpg as a sibling, so its URL resolves inside assets/
# regardless of how deep the page linking it sits.
assets = ["templates/letter.css", "templates/parchment.jpg"]

# Collection index entry for `opm chunk data/letters` (a directory run).
# The ODD's display='browse' models render title, place and date, and build
# their own link from $parameters?doc, which opm supplies per document.
[[chunking.fragments]]
name = "browse"
scope = "global"
xpath = "//teiHeader"
parameters = { display = "browse" }

[[chunking.fragments]]
name = "translation"
xpath = "//text[@type='translation']/div"
xpath_dynamic = "//text[@type = 'translation']"

[[chunking.fragments]]
name = "breadcrumbs"
xpath = "./ancestor::TEI"
parameters = { mode = "breadcrumb" }

[[chunking.fragments]]
name = "letter_head"
xpath = "./ancestor::TEI"
parameters = { mode = "letter-head" }

[[chunking.fragments]]
name = "register_people"
xpath = "./ancestor::TEI"
parameters = { mode = "register", category = "people" }

[[chunking.fragments]]
name = "register_places"
xpath = "./ancestor::TEI"
parameters = { mode = "register", category = "places" }
