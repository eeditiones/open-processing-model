#
# Documentation for an ODD: a website with `opm odd document`, a PDF or a
# Markdown file with `opm odd prepare` and `opm transform -t typst|markdown`.
# All build with the ODD, runs,
# templates and assets of this project rather than the packaged ones; anything
# you delete from templates/ falls back to the packaged file of the same name.
# `opm init --example odd` starts a project of your own from this one.

# What to document: without a source, the TEI Guidelines. `opm odd document
# SOURCE` on the command line wins over this.
[document]
# source = "my-customization.odd"
lang = "en"

[transform]
odd = "odd/tagdocs.odd"
# The formatting helpers odd/tagdocs.odd calls. Relations, catalogs and links
# are already in the tree it renders: `opm odd prepare` shows it.
xpath_extensions = [
    "opm.runtime.common_xpath_functions",
    "opm.runtime.spec_xpath_functions",
]

# PDF: `opm odd prepare -o schema.xml`, then
# `opm transform schema.xml -t typst -o docs.pdf` (or --preview).
[transform.typst]
template = "templates/tagdocs.typ.j2"

# What `opm odd document` passes the ODD itself; set here too, so a plain
# `opm chunk` over a prepared tree (`opm odd prepare`) renders the same.
[transform.parameters]
lng = "en"
mode = "ref"

# ── Run 1: the Guidelines read as a text ────────────────────────────────────
# Every top-level division of the text is a page — chapters, front matter and
# the back-matter appendices, the A–Z catalogs among them. The home page is a
# run of its own below, and specs inside the prose are left to the reference
# run.
[[chunking]]
name = "guidelines"
output_dir = "site"
xpath = "/TEI/text/(front|body|back)/div"
file_pattern = "{xml_id}.html"
template = "templates/page.html.j2"

[[chunking.fragments]]
name = "nav"
scope = "global"
xpath = "//list[@type='siteNav']"
parameters = { mode = "nav" }

# Per-chunk: the compact previous/next pair the right-hand rail shows under
# "On this page". Selects nothing on the home page, so the fragment is empty
# there.
[[chunking.fragments]]
name = "chapternav"
scope = "per-chunk"
xpath = "self::div[parent::front or parent::body or parent::back]"
parameters = { mode = "chapnav" }

# Per-chunk: the full-width previous/next cards that close a chapter. Rendered
# after the chunk body so footnotes stay with the prose that cites them.
[[chunking.fragments]]
name = "chapterend"
scope = "per-chunk"
xpath = "self::div[parent::front or parent::body or parent::back]"
parameters = { mode = "chapnav-end" }

# ── Run 2: the home page ──────────────────────────────────────────────────
# The site builder puts it directly under `text`, because it is no division of
# the text itself. `mode = "toc"` is what makes tagdocs.odd render the
# divisions it lists as a table of contents rather than as chapters, so the
# contents are read off the document here rather than prepared into it.
[[chunking]]
name = "home"
xpath = "/TEI/text/div"
file_pattern = "{xml_id}.html"
template = "templates/page.html.j2"
parameters = { mode = "toc" }

[[chunking.fragments]]
name = "nav"
scope = "global"
xpath = "//list[@type='siteNav']"
parameters = { mode = "nav" }

# ── Run 3: one reference page per element, class, macro and datatype ───────
# Handed run 1's anchors, so a spec's pointers into the prose (`#SATSRN`) land
# on the chapter page that holds them. The site builder stamps `ref-{ident}` on
# one copy of each spec; the copies it leaves unstamped (a spec both declared
# and quoted) are not pages.
[[chunking]]
name = "reference"
xpath = """
  //elementSpec[starts-with(@xml:id,'ref-')]
  | //classSpec[starts-with(@xml:id,'ref-')]
  | //macroSpec[starts-with(@xml:id,'ref-')]
  | //dataSpec[starts-with(@xml:id,'ref-')]
"""
file_pattern = "{xml_id}.html"
template = "templates/page.html.j2"

[[chunking.fragments]]
name = "nav"
scope = "global"
xpath = "//list[@type='siteNav']"
parameters = { mode = "nav" }

