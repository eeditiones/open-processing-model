[project]
pythonpath = ["."]
# The facsimile beside the text: a IIIF viewer (<pb-tify>) turned by the
# <pb-facs-link> each folio emits. pb-tify is the iiif profile's default viewer.
profiles = ["iiif"]

[transform]
odd = "odd/shakespeare.odd"

# Python modules whose functions the ODD calls as tp:…(); see the
# Extension modules guide for project prefixes and custom behaviours.
[[transform.extensions]]
module = "opm.runtime.common_xpath_functions"

# The <pb> models build the facsimile link from the document's own path:
# substring-after(document-uri(root($parameters?root)), $global:data-root || '/').
# data-root names the directory that path is taken relative to, which is what
# reduces .../data/F-ado.xml to F-ado.xml. address-by-id would key on
# TEI/@xml:id instead, which this document does not carry.
[transform.namespaces]
global = "http://teipublisher.com/global"

[transform.variables.global]
data-root = "data"
address-by-id = false

# teipublisher.odd carries a <pb> model for exactly this case: a static export
# with no api/iiif endpoint behind it. `static` selects it, and `context-path`
# is the prefix it builds the manifest URL from, pointing at what
# [transform.web] assets copies below. No ODD override involved.
#
# `{prefix}` is the path from a page back to the directory holding assets/:
# "../" for chunk pages, which always sit in a per-document subdirectory, and
# empty for `opm transform`, which writes assets/ right beside its output.
# Writing "assets" straight would point a chunk page at a subdirectory of its
# own, which is how the IIIF manifest goes missing.
[transform.parameters]
static = "1"
context-path = "{prefix}assets"

[transform.epub]
# Cascades after the packaged EPUB baseline and odd/shakespeare.css, undoing
# the two-column Folio layout and the page furniture that only makes sense
# beside a facsimile. Nothing here selects the chapters: a reading system
# repaginates, so EPUB output overrides the page selector in [chunking] below
# and falls back to divisions — one chapter per scene.
css = "templates/epub.css"

[transform.typst]
template = "templates/book.typ.tpl"

# Overlays [context] for Typst only. The Folio title runs to two sentences,
# which is unusable as a running head, so print needs a short form; the web
# templates go on using the full one from the teiHeader.
[transform.typst.context]
short_title = "Much Ado About Nothing"
source_note = "Bodleian First Folio, Arch. G c.7"
# Print a line number every nth typeset line.
line_number_every = 5

[transform.web]
template = "templates/chapbook.html.tpl"
# Copied verbatim into an assets/ directory beside the output (for chunks,
# <output-root>/assets/), keeping each directory name — so
# iiif/F-ado.xml/manifest.json lands at assets/F-ado.xml/manifest.json. That is
# where the <pb> model's facs="{prefix}assets/F-ado.xml/manifest.json" resolves
# to; nothing serves the iiif/ directory itself. The glob copies every play's
# manifest, so adding one needs no change here. [chunking] sets no assets of
# its own, so it uses these.
assets = ["templates/opm-theme-chapbook.css", "templates/facsimile.css", "iiif/*", "icon.png"]
# The <pb> model emits <pb-facs-link>, which stays inert markup showing the
# folio number until the pb-components bundle is loaded. With it on, each folio
# announces its manifest and page index on the "transcription" channel and the
# iiif profile's <pb-tify> viewer turns to that page.
webcomponents = true
# Render the whole play folio by folio, as the chunks do, rather than as one
# flow: each folio gets a <section class="opm-page"> of its own, which
# odd/shakespeare.css sets in the Folio's two columns, split at its <cb/>.
pages = "opm.navigation.tei_pb_chunks"

# Read by the chapbook template only, so they overlay [context] here rather
# than sitting in it: a Typst or EPUB run has no use for either.
[transform.web.context]

site_name = "Shakespeare Plays"

# Shown in the menu bar. The template looks it up in the copied assets, so the
# same name works on chunk pages and on a whole-document page.
logo = "icon.png"

# One chunk per <pb/> milestone rather than per division: `tei_pb_chunks`
# reconstructs the page as a synthetic tree, carrying the intervening <div>,
# <sp> and <lg> structure across the page boundary. `view = "page"` matches the
# key a pb-view sends for that mode.
[chunking]
view = "page"
selector = "opm.navigation.tei_pb_chunks"
output_dir = "chunks"

[[chunking.fragments]]
name = "title"
scope = "global"
xpath = "(//teiHeader/fileDesc/titleStmt/title)[1]"
parameters = { mode = "title" }

# No breadcrumb fragment: a folio page is not a division, so there is no
# heading trail to show. The chapbook template leaves the breadcrumb line out
# when the fragment is absent; the folio number stays where the Folio put it,
# in the text itself.
