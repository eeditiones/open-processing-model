site_name: Open Processing Model
site_description: Transform XML (TEI, DocBook, …) via ODD processing models — HTML, Markdown, DOCX, Typst.
site_url: https://opm.e-editiones.org/
repo_url: https://github.com/eeditiones/open-processing-model
repo_name: eeditiones/open-processing-model
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  variant: classic
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  pypi_url: https://pypi.org/project/open-processing-model/

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - javascripts/slideshow.js

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

watch:
  - src

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_if_no_docstring: false
            members_order: source
            separate_signature: true
            merge_init_into_class: true
            show_signature_annotations: true
            signature_crossrefs: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guide:
      - ODD files: guide/odd-files.md
      - Output formats: guide/output-formats.md
      - XPath extensions: guide/xpath-extensions.md
      - Templates & CSS: guide/templates-and-css.md
      - Chunking: guide/chunking.md
      - Search indexing: guide/search-indexing.md
      - ODD coverage: guide/coverage.md
      - Integration with TEI Publisher: guide/tei-publisher.md
      - Configuration (opm.toml): guide/configuration.md
  - CLI Reference: cli.md
  - API Reference:
      - Overview: api/index.md
      - Project: api/project.md
      - transform: api/transform.md
      - chunking: api/chunking.md
      - indexing: api/indexing.md
      - coverage: api/coverage.md
      - config: api/config.md
      - odd_compiler: api/odd-compiler.md
      - output functions: api/output-functions.md
      - output modes: api/output-modes.md
      - typst_compile: api/typst-compile.md
      - runtime: api/runtime.md
  - License: license.md
