[project]
pythonpath = ["extensions"]

[transform]
odd = "odd/docbook.odd"
xpath_extensions = [
    "opm.runtime.common_xpath_functions"
]

[transform.web.webcomponents]
# Enable TEI Publisher web-component output mode by default.
enabled = true

[transform.docx]
template = "templates/default.docx"

[transform.typst]
template = "templates/docbook.typ.j2"

[chunking]
selector = "opm.navigation.dbk_section_chunks"
depth = 2
output_dir = "chunks"
template = "templates/chapbook.html.j2"
# Cross-chunk link pattern. Placeholders: {file}, {stem}, {anchor}, {doc}.
# {doc} is the per-document subdirectory when chunking a directory of XML files.
# Default (omitted): relative form, e.g. "002.html#Pers"
link_pattern = "/{doc}/{file}"
doc_path = "doc"

[[chunking.fragments]]
name = "title"
scope = "global"
xpath = "(/article/info/title, /book/info/title)[1]"
parameters = { mode = "title" }

[[chunking.fragments]]
name = "toc"
scope = "global"
xpath = "(/article, /book)[1]"
parameters = { mode = "toc" }

[[chunking.fragments]]
name = "breadcrumbs"
scope = "per-chunk"
xpath = "."
parameters = { mode = "breadcrumb" }
