[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-processing-model"
version = "0.1.0"
description = "Open Processing Model — transform XML via ODD processing models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.0",
    "elementpath>=4.8",
    "typer>=0.24.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "babel",
    "python-docx>=1.1",
    "platformdirs>=4.10.0",
]

[dependency-groups]
dev = [
    "pyinstrument>=5.1.2",
    "pytest>=8.0",
]
docs = [
    "zensical>=0.0.38",
    "mkdocstrings[python]>=0.26",
    "ruff>=0.6",
]

[project.scripts]
opm = "opm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opm"]

[tool.hatch.build.targets.wheel.force-include]
"src/opm/resources/templates/default_document.html.j2" = "opm/resources/templates/default_document.html.j2"
"src/opm/resources/templates/default_document.typ.j2" = "opm/resources/templates/default_document.typ.j2"
"src/opm/resources/odd/teipublisher.odd" = "opm/resources/odd/teipublisher.odd"
"src/opm/resources/odd/tp.css" = "opm/resources/odd/tp.css"
"src/opm/resources/styles/default-styles.css" = "opm/resources/styles/default-styles.css"

[tool.hatch.build.targets.sdist]
include = [
    "src/opm/resources/templates/default_document.html.j2",
    "src/opm/resources/templates/default_document.typ.j2",
    "src/opm/resources/odd/teipublisher.odd",
    "src/opm/resources/odd/tp.css",
    "src/opm/resources/styles/default-styles.css",
]
