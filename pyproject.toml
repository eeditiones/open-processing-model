[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-processing-model"
version = "0.1.0"
description = "Open Processing Model — transform XML via ODD processing models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.0",
    "elementpath>=4.8",
    "typer>=0.24.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "babel",
    "python-docx>=1.1",
    "platformdirs>=4.10.0",
]

[dependency-groups]
dev = [
    "pyinstrument>=5.1.2",
    "pytest>=8.0",
]
docs = [
    "zensical>=0.0.38",
    "mkdocstrings[python]>=0.26",
    "ruff>=0.6",
]

[project.scripts]
opm = "opm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opm"]
