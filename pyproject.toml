[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tei-publisher-py"
version = "0.1.0"
description = "Python implementation of tei-publisher-lib transformations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.0",
    "elementpath>=4.8",
    "typer>=0.24.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "babel",
]

[dependency-groups]
dev = [
    "pyinstrument>=5.1.2",
    "pytest>=8.0",
]

[project.scripts]
teipublisher = "teipublisher.teipublisher_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/teipublisher"]

[tool.hatch.build.targets.wheel.force-include]
"src/teipublisher/templates/default_document.html.j2" = "teipublisher/templates/default_document.html.j2"

[tool.hatch.build.targets.sdist]
include = [
    "src/teipublisher/templates/default_document.html.j2",
]
