[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "open-processing-model"
version = "0.9.0"
description = "Open Processing Model — transform XML via ODD processing models"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSING.md"]
authors = [{ name = "e-editiones", email = "info@e-editiones.org" }]
keywords = ["tei", "xml", "odd", "processing-model", "xslt", "publishing", "digital-humanities"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = [
    "lxml>=5.0",
    "elementpath>=4.8",
    "typer>=0.24.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "babel",
    "python-docx>=1.1",
    "platformdirs>=4.10.0",
    "questionary>=2.1.1",
    "rich-pyfiglet>=2.0.1",
]

[dependency-groups]
dev = [
    "pyinstrument>=5.1.2",
    "pytest>=8.0",
    # Build backend, needed here so tests can exercise hatch_build.py directly.
    "hatchling",
]
docs = [
    "zensical>=0.0.38",
    "mkdocstrings[python]>=0.26",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/eeditiones/open-processing-model"
Documentation = "https://eeditiones.github.io/open-processing-model/"
Repository = "https://github.com/eeditiones/open-processing-model"
Issues = "https://github.com/eeditiones/open-processing-model/issues"
Changelog = "https://github.com/eeditiones/open-processing-model/blob/main/CHANGELOG.md"

[project.scripts]
opm = "opm.cli:main"

[tool.hatch.build.targets.sdist]
# Explicit: hatchling's default sweeps in the whole working tree, including the
# multi-megabyte .cache/ of compiled ODD modules and local editor scratch files.
include = [
    "src",
    "tests",
    "examples",
    "docs",
    "scripts",
    "hatch_build.py",
    "mkdocs.yml",
    "opm.toml",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "LICENSES",
    "LICENSING.md",
    "REUSE.toml",
]
exclude = ["**/chunks", "**/output", "**/.cache", "**/__pycache__", "**/.DS_Store"]

[tool.hatch.build.targets.wheel]
packages = ["src/opm"]

# Ships examples/ as opm/resources/examples for `opm init --example`; see the
# module docstring for why a plain force-include map will not do.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
