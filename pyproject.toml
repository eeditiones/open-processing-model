[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "open-processing-model"
version = "0.1.0"
description = "Open Processing Model — transform XML via ODD processing models"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTIONS.md", "LICENSE-MEMBER-GRANT.md"]
authors = [{ name = "e-editiones", email = "info@e-editiones.org" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "lxml>=5.0",
    "elementpath>=4.8",
    "typer>=0.24.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "babel",
    "python-docx>=1.1",
    "platformdirs>=4.10.0",
    "questionary>=2.1.1",
]

[dependency-groups]
dev = [
    "pyinstrument>=5.1.2",
    "pytest>=8.0",
    # Build backend, needed here so tests can exercise hatch_build.py directly.
    "hatchling",
]
docs = [
    "zensical>=0.0.38",
    "mkdocstrings[python]>=0.26",
    "ruff>=0.6",
]

[project.scripts]
opm = "opm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opm"]

# Ships examples/ as opm/resources/examples for `opm init --example`; see the
# module docstring for why a plain force-include map will not do.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
