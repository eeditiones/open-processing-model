# Defaults for the template `context`, beneath a project's [context] in
# opm.toml. Override any of them there, e.g.
#
#   [context.theme.layout.after]
#   width = "20rem"
#
# or for web output only under [transform.web.context.theme.layout.after]. A
# template's frontmatter wins over both.

[theme]
# "light", "dark", or "auto" to follow the reader's system. Applies to the
# colours of opm-layout.css; a theme stylesheet that sets its own colours
# keeps them.
color_scheme = "light"

[theme.layout]
# Extra classes on the layout grid.
class = ""
# false when context.logo is a wordmark that already spells the site's name:
# the logo then stands alone, the name as its alt text.
logo_title = true
# Text of the link that lets keyboard users jump past the header.
skip_label = "Skip to content"
# Labels of the toolbar's links to the previous and next page.
previous_label = "Previous"
next_label = "Next"
# Text of the link that closes a drawer.
close_label = "Close"

[theme.layout.before]
# Width of the column left of the text (any CSS length). Unset, the template's
# stylesheet decides (opm-layout.css: 18rem).
# width = "18rem"
# On narrow screens: "drawer" slides in from the side, "stack" goes below the text.
mobile = "drawer"
# Text of the button that opens the drawer.
label = "Contents"
# Start the column level with the toolbar instead of below it.
# span_top = true

[theme.layout.after]
# width = "18rem"
mobile = "stack"
label = "More"

# Links in the menubar, after the logo, e.g.
#   items = [{ label = "About", url = "about.html" }]
[menu]
items = []

[features]
# The menubar across the top: logo, menu links and the template's controls.
menubar = true

[features.toolbar]
# The toolbar above the text: breadcrumbs and the template's controls.
enabled = true
# Links to the previous and next page of a chunked document.
navigation = false

# The collection index `opm chunk` writes for a directory
# (default_index.html.tpl). Set the text above the list with [context]
# site_name and description; these are its other words.
[theme.index]
# Small heading above the collection's name.
eyebrow = "Collection"
# Counted things. Sections are only counted from two on.
document_one = "document"
document_many = "documents"
section_many = "sections"
filter_label = "Filter documents"
filter_placeholder = "Filter by title, author, date …"
list_label = "Show as list"
grid_label = "Show as grid"
empty_label = "No document matches the filter."
open_label = "Open"
# How the documents are shown first: "list" or "grid". Readers can switch.
view = "list"
# Most section ticks drawn for one document; more are shown as "+".
max_ticks = 24
# The filter bar appears from this many documents on.
filter_min = 2

# A picture behind the masthead, e.g. a facsimile page or a portrait.
[theme.index.hero]
# A file name in the output's assets/ folder (list it under
# [transform.web] assets to have it copied there), a path, or a URL.
# Unset: no picture.
# image = "cover.jpg"
# Which part stays in view when the picture is cropped, as CSS
# background-position: "center", "top", "center 30%", …
position = "center"
# "light" text on a darkened picture, or "dark" text on a lightened one.
text = "light"
