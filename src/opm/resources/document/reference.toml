#
# Packaged chunking config for `opm odd document`, second of two runs: one
# reference page per element, class, macro and datatype. Paths are relative to
# this file (resources/document/). Runs after guidelines.toml, into the same
# directory, and is handed that run's anchors so a spec's pointers into the
# prose (`#SATSRN`) land on the chapter page that holds them.

[transform]
odd = "../odd/tagdocs.odd"
xpath_extensions = [
    "opm.runtime.common_xpath_functions",
    "opm.runtime.spec_xpath_functions",
]

# The site builder stamps `ref-{ident}` on one copy of each spec; the copies it
# leaves unstamped (a spec both declared and quoted) are not pages.
[chunking]
odd = "../odd/tagdocs.odd"
xpath = """
  //elementSpec[starts-with(@xml:id,'ref-')]
  | //classSpec[starts-with(@xml:id,'ref-')]
  | //macroSpec[starts-with(@xml:id,'ref-')]
  | //dataSpec[starts-with(@xml:id,'ref-')]
"""
file_pattern = "{xml_id}.html"
template = "page.html.j2"

[[chunking.fragments]]
name = "nav"
scope = "global"
xpath = "//list[@type='siteNav']"
parameters = { mode = "nav" }
